# The browser version, published to GitHub Pages on every push to main.
#
# One-time setup, and it has to be done by hand because the workflow's own
# token is not allowed to switch Pages on: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Until then this run fails at the
# deploy step and nothing else is affected.

name: Pages

on:
  push:
    branches: [main]
  # The free-issues index is rebuilt from the `index-data` branch four times a day.
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
      - name: Fetch the index data (absent before the first collector run)
        run: |
          if git ls-remote --exit-code --heads origin index-data >/dev/null; then
            git fetch --depth 1 origin index-data
            git worktree add index-data origin/index-data
          fi
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
