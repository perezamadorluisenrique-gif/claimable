name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
      - run: npm run check
      - run: npm test
      - run: npm run compare
      - name: The README demo is a recording, so it must still match the real output
        run: |
          npm run demo
          git diff --exit-code docs/demo.svg
      - run: npm run build
      - name: The browser version assembles from the same build
        run: node scripts/build-web.js
      - name: Smoke-test the packed tarball the way npx runs it
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/install-test/node_modules/claimable /tmp/install-test/node_modules/.bin
          tar -xzf /tmp/claimable-*.tgz -C /tmp/install-test/node_modules/claimable --strip-components=1
          node /tmp/install-test/node_modules/claimable/dist/cli.js --help
          # npx does not run the file, it runs npm's symlink to it. That is the
          # path that broke once by printing nothing and exiting 0, so assert on
          # the output rather than on the exit code.
          chmod +x /tmp/install-test/node_modules/claimable/dist/cli.js
          ln -s ../claimable/dist/cli.js /tmp/install-test/node_modules/.bin/claimable
          /tmp/install-test/node_modules/.bin/claimable --help | grep -q 'USAGE'
          test "$(/tmp/install-test/node_modules/.bin/claimable --version)" = "$(node -p 'require("./package.json").version')"

  # The published package is plain JavaScript and runs on older Node than the
  # TypeScript sources need. package.json promises Node 18, so every even
  # release from there runs the packed tarball, through the bin symlink npx
  # uses, against a recorded issue.
  package-runs-on:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
      - run: npm run build && npm pack --pack-destination /tmp
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run the packed tarball on Node ${{ matrix.node }}
        env:
          CLAIMABLE_CASSETTE: replay
          CLAIMABLE_NOW: "2026-09-15T12:00:00Z"
          NO_COLOR: "1"
          GITHUB_TOKEN: ""
        run: |
          node --version
          mkdir -p /tmp/compat/node_modules/claimable /tmp/compat/node_modules/.bin
          tar -xzf /tmp/claimable-*.tgz -C /tmp/compat/node_modules/claimable --strip-components=1
          chmod +x /tmp/compat/node_modules/claimable/dist/cli.js
          ln -s ../claimable/dist/cli.js /tmp/compat/node_modules/.bin/claimable
          /tmp/compat/node_modules/.bin/claimable --help | grep -q 'USAGE'
          # Exit 1 is "nothing viable", which is the right answer for this issue.
          out=$(/tmp/compat/node_modules/.bin/claimable frappe/lms#2711 --thorough --hacktoberfest || true)
          echo "$out"
          echo "$out" | grep -q 'PR #2727 by @ajzal-byte is already open'
