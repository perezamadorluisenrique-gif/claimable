name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm run check
      - run: npm test
      - run: npm run compare
      - run: npm run build
      - name: Smoke-test the packed tarball from inside node_modules
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/install-test/node_modules/claimable
          tar -xzf /tmp/claimable-*.tgz -C /tmp/install-test/node_modules/claimable --strip-components=1
          node /tmp/install-test/node_modules/claimable/dist/cli.js --help
