name: "Claimable claim bot"
description: "Let contributors reserve an issue with /claim. One short comment per issue, a reminder if it goes quiet, and nothing guessed."
author: "Luis Enrique Perez Amador"
branding:
  icon: user-check
  color: green

inputs:
  token:
    description: "Token that assigns, labels and comments; needs issues: write"
    default: ${{ github.token }}
  dry-run:
    description: "true only describes what the bot would do, in the job summary; it writes nothing"
    default: "false"

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: |
        if node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>=24||(a===23&&b>=6)||(a===22&&b>=18)?0:1)' 2>/dev/null; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.node.outputs.ok != 'true'
      uses: actions/setup-node@v5
      with:
        node-version: "22.18"
    - id: run
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        NO_COLOR: "1"
      run: node "$GITHUB_ACTION_PATH/main.ts"
